name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    name: Mobile (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci --coverage

  worker:
    name: Render worker (typecheck, test with real ffmpeg)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  worker-docker-build:
    name: Render worker (Docker image builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: worker
          push: false
          tags: dayline-worker:ci

  database:
    name: Supabase schema (migrations + RLS security tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply stub schema + migrations
        run: |
          for f in supabase/tests/_supabase_stub.sql supabase/migrations/*.sql; do
            echo "--- $f ---"
            psql -v ON_ERROR_STOP=1 -f "$f" postgres
          done
      - name: Run RLS security test suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_security.test.sql postgres
      - name: Run worker job-claim test suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/worker_claim.test.sql postgres

  dependency-audit:
    name: Dependency audit (high/critical fails the build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd mobile && npm ci && npm audit --audit-level=high
      - run: cd worker && npm ci && npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  edge-functions-typecheck:
    name: Edge Functions (Deno typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check every function
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "--- $f ---"
            deno check "$f"
          done
